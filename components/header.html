<!-- Top Announcement Bar (Header component) -->
<aside class="top-announcement-bar" aria-label="Quick contact and garage opening hours">
  <div class="header-container top-announcement-inner">
    <div class="top-bar-item">
      <span class="icon-pin">📍</span>
      <span>161 Rolfe Street, Smethwick, Birmingham B66 2AU</span>
    </div>
    <div class="top-bar-right">
      <div class="status-live-pill">
        <span class="status-live-dot"></span>
        <span>Open Everyday: 9:00 AM – 6:00 PM</span>
      </div>
      <a href="tel:01215589215" class="top-phone-link">
        <span>📞</span> <strong>0121 558 9215</strong>
      </a>
    </div>
  </div>
</aside>

<!-- Main Navigation Header (Header component) -->
<header class="site-header">
  <div class="header-container">
    <a href="/" class="site-logo" aria-label="BK MOT Centre Home">
      <img src="/assets/images/logo.png" alt="BK Mot Centre Logo" width="168" height="52">
    </a>

    <nav class="site-nav" aria-label="Primary Navigation">
      <ul class="nav-list">
        <li><a href="/" class="nav-link{{#if isHome}} active{{/if}}">Home</a></li>
        <li><a href="/aboutus/" class="nav-link{{#if isAbout}} active{{/if}}">About Us</a></li>
        <li><a href="/dpf-cleaning-service/" class="nav-link{{#if isDpf}} active{{/if}}">DPF Cleaning Service</a></li>
        <li><a href="/services/" class="nav-link{{#if isServices}} active{{/if}}">Services</a></li>
        <li><a href="/contactus/" class="nav-link{{#if isContact}} active{{/if}}">Contact Us</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="tel:01215589215" class="header-call-btn">
        <span class="call-btn-icon">📞</span>
        <span class="call-btn-text">
          <span class="call-btn-label">Call Now</span>
          <span class="call-btn-val">0121 558 9215</span>
        </span>
      </a>
      <a href="/contactus/" class="skewed-btn red-btn header-book-btn">Book Appointment <span class="btn-arrow-icon">&gt;</span></a>
    </div>

    <button class="mobile-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</header>
